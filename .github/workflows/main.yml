name: Gym Logic Engine
on:
  schedule:
    # 5 minutes is GitHub's shortest supported interval — schedule triggers are
    # "best effort" and can still lag under load, so this only shrinks the worst
    # case gap, it doesn't guarantee precise timing. The script itself sleeps to
    # the exact strike moment once a run does start (see gym_script.py), so this
    # setting mainly matters for how late a run can start in the first place.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      class_date:
        description: 'Date (YYYY-MM-DD) — leave blank to just run the check (used by the external wake-up trigger)'
        required: false
        default: ''
      class_time:
        description: 'Time (e.g., 3:30 PM) — leave blank to just run the check'
        required: false
        default: ''

permissions:
  contents: write

# The external trigger fires every 60s, but a run (scrape + booker) can take longer
# than that. Without this, overlapping runs raced on `git push` — one would get
# rejected as non-fast-forward since the remote had moved since its checkout.
# Queue instead of running in parallel: never drop a tick, never race a push.
concurrency:
  group: gym-logic-engine
  cancel-in-progress: false

jobs:
  check_and_book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Target Class
        if: github.event_name == 'workflow_dispatch'
        env:
          CLASS_DATE: ${{ github.event.inputs.class_date }}
          CLASS_TIME: ${{ github.event.inputs.class_time }}
        run: |
          python3 - <<'EOF'
          import json, os, sys

          date = os.environ.get("CLASS_DATE", "").strip()
          time = os.environ.get("CLASS_TIME", "").strip()

          if not date or not time:
              print("No date/time provided — this is just a wake-up call, nothing to arm.")
              sys.exit(0)

          try:
              with open("pending_booking.json") as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = []

          if isinstance(data, dict):
              data = [data]
          elif not isinstance(data, list):
              data = []

          if not any(b.get("date") == date and b.get("time") == time for b in data):
              data.append({"date": date, "time": time})

          with open("pending_booking.json", "w") as f:
              json.dump(data, f, indent=2)
          EOF
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_booking.json
          git commit -m "Arming for ${{ github.event.inputs.class_time }} on ${{ github.event.inputs.class_date }}" || echo "No changes to commit"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i), fetching and rebasing..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed"; git rebase --abort; exit 1; }
          done
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Scrape Class List
        continue-on-error: true # don't let a scraper hiccup block the actual booking check
        run: python bot/scraper.py
      - name: Arm Standing Bookings
        # Between the scrape and the booker on purpose: a class matched off this
        # minute's scrape can be struck in this same run.
        continue-on-error: true # a matcher problem shouldn't block an already-queued strike
        run: python bot/standing.py
      - name: Run Booker
        env:
          GYM_EMAIL: ${{ secrets.GYM_EMAIL }}
          GYM_PASSWORD: ${{ secrets.GYM_PASSWORD }}
        run: python bot/striker.py
      - name: Commit Status
        if: always()
        run: |
          git config --global user.name "GymBot"
          git config --global user.email "gymbot@users.noreply.github.com"
          git add status.json pending_booking.json class_list.json scrape_status.json standing_bookings.json
          git commit -m "Update booking status and class list" || echo "No changes"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (attempt $i), fetching and rebasing..."
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed"; git rebase --abort; exit 1; }
          done
      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            final_failure.png
            booking_result.png
          if-no-files-found: ignore
