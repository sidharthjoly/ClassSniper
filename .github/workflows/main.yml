name: Gym Logic Engine
on:
  schedule:
    # 5 minutes is GitHub's shortest supported interval — schedule triggers are
    # "best effort" and can still lag under load, so this only shrinks the worst
    # case gap, it doesn't guarantee precise timing. The script itself sleeps to
    # the exact strike moment once a run does start (see gym_script.py), so this
    # setting mainly matters for how late a run can start in the first place.
    - cron: '*/5 * * * *'
  # The external cron POSTs here every 60s. It used to be able to arm a booking
  # by passing a date and time; that path wrote pending_booking.json into the
  # repo, which is exactly what stopped being a thing the repo holds. Arming goes
  # through the dashboard and the API worker now.
  workflow_dispatch:

permissions:
  contents: write

# The external trigger fires every 60s, but a run (scrape + booker) can take longer
# than that. Without this, overlapping runs raced on `git push` — one would get
# rejected as non-fast-forward since the remote had moved since its checkout.
# Queue instead of running in parallel: never drop a tick, never race a push.
concurrency:
  group: gym-logic-engine
  cancel-in-progress: false

jobs:
  check_and_book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Pull Private State
        # Deliberately no continue-on-error. The striker reads a missing queue as
        # "nothing to do" and exits green, so a failed pull would look exactly
        # like an empty queue: a silently missed strike. Fail the run loudly
        # instead — the next tick is 60 seconds away.
        env:
          CLASSSNIPER_API: ${{ secrets.CLASSSNIPER_API }}
          CLASSSNIPER_BOT_TOKEN: ${{ secrets.CLASSSNIPER_BOT_TOKEN }}
        run: python bot/state.py pull
      - name: Scrape Class List
        continue-on-error: true # don't let a scraper hiccup block the actual booking check
        run: python bot/scraper.py
      - name: Arm Standing Bookings
        # Between the scrape and the booker on purpose: a class matched off this
        # minute's scrape can be struck in this same run.
        continue-on-error: true # a matcher problem shouldn't block an already-queued strike
        run: python bot/standing.py
      - name: Run Booker
        env:
          GYM_EMAIL: ${{ secrets.GYM_EMAIL }}
          GYM_PASSWORD: ${{ secrets.GYM_PASSWORD }}
        run: python bot/striker.py
      - name: Push Private State
        if: always() # a strike that happened still has to be recorded
        env:
          CLASSSNIPER_API: ${{ secrets.CLASSSNIPER_API }}
          CLASSSNIPER_BOT_TOKEN: ${{ secrets.CLASSSNIPER_BOT_TOKEN }}
        run: python bot/state.py push
      - name: Commit Public Data
        if: always()
        run: |
          git config --global user.name "GymBot"
          git config --global user.email "gymbot@users.noreply.github.com"
          # The gym's own timetable and a scrape heartbeat. Everything personal —
          # what you booked, what's queued, your standing rules — lives in the
          # worker's database, because this repo is public.
          git add class_list.json scrape_status.json
          git commit -m "Update class list" || echo "No changes"
          for i in 1 2 3 4 5; do
            git push && break
            # Rebasing used to go here, and it could not work: scrape_status.json
            # carries a timestamp so every run rewrites it, which makes any push
            # race a guaranteed conflict on the same lines, and the rebase
            # aborted the whole run. Both files are generated output with no
            # merge semantics — the newest scrape is simply the right one — so
            # take whatever landed and re-apply this run's copy on top.
            echo "Push rejected (attempt $i) — taking the latest and re-applying this run's files"
            cp class_list.json scrape_status.json "$RUNNER_TEMP/"
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/class_list.json" "$RUNNER_TEMP/scrape_status.json" .
            git add class_list.json scrape_status.json
            git commit -m "Update class list" || echo "No changes"
          done
      - name: Upload Debug Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            final_failure.png
            booking_result.png
          if-no-files-found: ignore
          # These show the booking confirmation screen, so they carry the same
          # thing the rest of this repo deliberately stopped publishing: which
          # class, which gym, what time. Artifacts on a public repo are
          # downloadable by anyone signed into GitHub. They earn their keep while
          # the browser path is still unverified, so keep them — but for a day,
          # not the default ninety.
          retention-days: 1
